<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>リバーシ</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="リバーシ">
  <!-- ホーム画面用のアイコン指定 -->
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
<canvas id="gameCanvas" width="600" height="800"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resize() {
  let scale = Math.min(window.innerWidth / 600, window.innerHeight / 800);
  canvas.style.width = (600 * scale) + 'px';
  canvas.style.height = (800 * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playTone(freq, duration) {
  if (!audioCtx) return;
  try {
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

function playExplosionSound() {
  if (!audioCtx) return;
  try {
    let bufferSize = audioCtx.sampleRate * 0.9;
    let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    let data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      let t = i / audioCtx.sampleRate;
      let progress = i / bufferSize;
      let env = Math.exp(-progress * 4.5);
      let noise = Math.random() * 2 - 1;
      let freq = 130 * Math.exp(-progress * 6) + 20;
      let bass = Math.sin(2 * Math.PI * freq * t);
      data[i] = (noise * 0.55 + bass * 0.85) * env;
    }
    let source = audioCtx.createBufferSource();
    source.buffer = buffer;
    let gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
    source.connect(gain);
    gain.connect(audioCtx.destination);
    source.start();
  } catch(e) {}
}

function playWinSound() {
  if (!audioCtx) return;
  let notes = [523.25, 659.25, 783.99, 1046.50];
  notes.forEach((freq, idx) => {
    setTimeout(() => { playTone(freq, 0.25); }, idx * 150);
  });
}

class Particle {
  constructor(px, py, fullScreen) {
    this.x = px;
    this.y = py;
    if (fullScreen) {
      let angle = Math.random() * Math.PI * 2;
      let speed = 8 + Math.random() * 22;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.size = 15 + Math.random() * 25;
      this.maxLife = 30 + Math.random() * 30;
    } else {
      this.vx = (Math.random() - 0.5) * 8;
      this.vy = (Math.random() - 0.5) * 8;
      this.size = 25 + Math.random() * 45;
      this.maxLife = 20 + Math.random() * 30;
    }
    this.life = this.maxLife;
    let r = Math.random();
    if (r < 0.4) this.col = {r: 255, g: 180 + Math.random()*75, b: 0};
    else if (r < 0.7) this.col = {r: 255, g: 50 + Math.random()*70, b: 0};
    else if (r < 0.9) this.col = {r: 255, g: 255, b: 255};
    else this.col = {r: 80, g: 80, b: 80};
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.92;
    this.vy *= 0.92;
    this.size *= 0.95;
    this.life--;
  }
  display() {
    let alpha = this.life / this.maxLife;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = `rgb(${this.col.r}, ${this.col.g}, ${this.col.b})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  isDead() { return this.life <= 0; }
}

class TitleStone {
  constructor() {
    this.x = Math.random() * 600;
    this.y = Math.random() * 800;
    this.vx = (Math.random() - 0.5) * 3;
    this.vy = (Math.random() - 0.5) * 3;
    this.size = 40 + Math.random() * 40;
    this.type = Math.random() > 0.5 ? 1 : 2;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    if (this.x < -50) this.x = 650;
    if (this.x > 650) this.x = -50;
    if (this.y < -50) this.y = 850;
    if (this.y > 850) this.y = -50;
  }
  display() {
    ctx.save();
    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
    ctx.beginPath();
    ctx.arc(this.x + 4, this.y + 4, this.size / 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = this.type === 1 ? 'rgba(30, 30, 30, 0.7)' : 'rgba(240, 240, 240, 0.7)';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

let screen = 0;
let titleStones = Array(12).fill().map(() => new TitleStone());
let particles = [];
let isExploding = false;
let shockwaveSize = 0;
let explosionX = 0, explosionY = 0;
let shakeTimer = 0;
let flashAlpha = 0;

let board = Array(8).fill().map(() => Array(8).fill(0));
let fromBoard = Array(8).fill().map(() => Array(8).fill(0));
let toBoard = Array(8).fill().map(() => Array(8).fill(0));
let animTimer = Array(8).fill().map(() => Array(8).fill(0));
let animDelay = Array(8).fill().map(() => Array(8).fill(0));
const ANIM_DURATION = 12;

let cellSize = 75;
let turn = 1;
let isGameOver = false;
let winSoundPlayed = false;
let message = "";
let mode = false;
let isVsAI = true;
let aiTimer = 0;
const AI_DELAY = 30;
let foulLoser = 0;

let scoreTapCount = 0;
let lastScoreTapTime = 0;

const EVAL_BOARD = [
  [ 100, -20,  10,   5,   5,  10, -20, 100 ],
  [ -20, -50,  -2,  -2,  -2,  -2, -50, -20 ],
  [  10,  -2,   1,   1,   1,   1,  -2,  10 ],
  [   5,  -2,   1,   1,   1,   1,  -2,   5 ],
  [   5,  -2,   1,   1,   1,   1,  -2,   5 ],
  [  10,  -2,   1,   1,   1,   1,  -2,  10 ],
  [ -20, -50,  -2,  -2,  -2,  -2, -50, -20 ],
  [ 100, -20,  10,   5,   5,  10, -20, 100 ]
];

function initGame() {
  for (let y = 0; y < 8; y++) {
    for (let x = 0; x < 8; x++) {
      board[y][x] = 0;
      fromBoard[y][x] = 0;
      toBoard[y][x] = 0;
      animTimer[y][x] = 0;
      animDelay[y][x] = 0;
    }
  }
  board[3][3] = 2; board[4][4] = 2;
  board[3][4] = 1; board[4][3] = 1;
  turn = 1;
  isGameOver = false;
  winSoundPlayed = false;
  message = "";
  aiTimer = 0;
  foulLoser = 0;
  particles = [];
  isExploding = false;
  shakeTimer = 0;
  flashAlpha = 0;
}

function isAnimating() {
  for (let y = 0; y < 8; y++) {
    for (let x = 0; x < 8; x++) {
      if (animTimer[y][x] > 0 || animDelay[y][x] > 0) return true;
    }
  }
  return false;
}

let frameCount = 0;

function loop() {
  frameCount++;
  ctx.clearRect(0, 0, 600, 800);

  if (screen === 0) {
    drawTitleScreen();
  } else {
    drawGameScreen();
  }
  requestAnimationFrame(loop);
}

function drawTitleScreen() {
  ctx.fillStyle = 'rgb(0, 110, 50)';
  ctx.fillRect(0, 0, 600, 800);

  for (let ts of titleStones) {
    ts.update();
    ts.display();
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
  ctx.font = 'bold 54px sans-serif';
  ctx.fillText("REVERSI", 303, 277);

  let pulse = Math.sin(frameCount * 0.05) * 3;
  ctx.fillStyle = 'rgb(255, 255, 255)';
  ctx.font = `bold ${54 + pulse * 0.5}px sans-serif`;
  ctx.fillText("REVERSI", 300, 275);

  ctx.fillStyle = 'rgb(230, 230, 200)';
  ctx.font = '14px sans-serif';
  ctx.fillText("- ADVANCED AI & HARD MODE -", 300, 335);

  drawButton(180, 380, 240, 40, "MODE: " + (isVsAI ? "1P (VS AI)" : "2P (VS PLAYER)"), false);
  drawButton(180, 435, 240, 40, "HARD MODE: " + (mode ? "ON" : "OFF"), mode);
  drawButton(160, 495, 280, 60, "START GAME", false, true);
}

function drawButton(x, y, w, h, text, isHighlight, isStart = false) {
  ctx.save();
  ctx.strokeStyle = isStart ? 'rgb(255, 215, 0)' : 'rgb(150, 150, 150)';
  ctx.lineWidth = isStart ? 3 : 1;
  ctx.fillStyle = isStart ? 'rgb(0, 140, 60)' : (isHighlight ? 'rgb(160, 30, 30)' : 'rgba(70, 70, 70, 0.88)');
  
  ctx.beginPath();
  if (ctx.roundRect) {
    ctx.roundRect(x, y, w, h, 10);
  } else {
    ctx.rect(x, y, w, h);
  }
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = 'rgb(255, 255, 255)';
  ctx.font = isStart ? 'bold 22px sans-serif' : '14px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x + w / 2, y + h / 2);
  ctx.restore();
}

function drawGameScreen() {
  if (isGameOver && !winSoundPlayed) {
    let blackCount = 0;
    let whiteCount = 0;
    for (let y = 0; y < 8; y++) {
      for (let x = 0; x < 8; x++) {
        if (board[y][x] === 1) blackCount++;
        if (board[y][x] === 2) whiteCount++;
      }
    }
    if (blackCount !== whiteCount || foulLoser !== 0) {
      playWinSound();
    }
    winSoundPlayed = true;
  }

  ctx.save();
  if (shakeTimer > 0) {
    let currentShake = (shakeTimer / 50) * 35;
    ctx.translate((Math.random() - 0.5) * currentShake * 2, (Math.random() - 0.5) * currentShake * 2);
    shakeTimer--;
  }

  if (mode && !isGameOver) {
    ctx.fillStyle = (turn === 1) ? 'rgb(0, 0, 0)' : 'rgb(255, 255, 255)';
  } else {
    ctx.fillStyle = 'rgb(0, 140, 0)';
  }
  ctx.fillRect(0, 0, 600, 800);

  for (let y = 0; y < 8; y++) {
    for (let x = 0; x < 8; x++) {
      ctx.strokeStyle = (mode && !isGameOver) ? (turn === 1 ? 'rgb(120, 120, 120)' : 'rgb(60, 60, 60)') : 'rgb(0, 0, 0)';
      ctx.lineWidth = 2;
      ctx.strokeRect(x * cellSize, y * cellSize, cellSize, cellSize);

      let cx = x * cellSize + cellSize / 2;
      let cy = y * cellSize + cellSize / 2;

      if (animDelay[y][x] > 0) {
        drawStone(cx, cy, fromBoard[y][x], 1.0);
        animDelay[y][x]--;
        if (animDelay[y][x] === 0) playTone(480, 0.05);
      } else if (animTimer[y][x] > 0) {
        animTimer[y][x]--;
        let elapsed = ANIM_DURATION - animTimer[y][x];
        let half = ANIM_DURATION / 2;
        let stoneColor = (elapsed < half) ? fromBoard[y][x] : toBoard[y][x];
        let scaleX = (elapsed < half) ? (1.0 - (elapsed / half)) : ((elapsed - half) / half);
        drawStone(cx, cy, stoneColor, Math.max(0.01, scaleX));
      } else {
        drawStone(cx, cy, board[y][x], 1.0);
        if (!isGameOver && !isAnimating() && !mode && canPlaceAt(x, y, turn)) {
          if (!isVsAI || turn === 1) {
            ctx.fillStyle = (turn === 1) ? 'rgba(0, 0, 0, 0.35)' : 'rgba(255, 255, 255, 0.55)';
            ctx.beginPath();
            ctx.arc(cx, cy, cellSize * 0.125, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
    }
  }

  let blackCount = 0;
  let whiteCount = 0;
  for (let y = 0; y < 8; y++) {
    for (let x = 0; x < 8; x++) {
      if (board[y][x] === 1) blackCount++;
      if (board[y][x] === 2) whiteCount++;
    }
  }

  drawBottomPanel(blackCount, whiteCount);

  if (isExploding) {
    ctx.strokeStyle = `rgba(255, 220, 100, ${Math.max(0, 1 - shockwaveSize / 1400)})`;
    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.arc(explosionX, explosionY, shockwaveSize / 2, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = `rgba(255, 120, 0, ${Math.max(0, 1 - shockwaveSize / 1000)})`;
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.arc(explosionX, explosionY, (shockwaveSize * 0.7) / 2, 0, Math.PI * 2);
    ctx.stroke();

    shockwaveSize += 30;

    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.display();
      if (p.isDead()) particles.splice(i, 1);
    }
    if (particles.length === 0 && shockwaveSize > 1400) {
      isExploding = false;
    }
  }

  if (flashAlpha > 0) {
    ctx.fillStyle = `rgba(255, 230, 50, ${flashAlpha / 255})`;
    ctx.fillRect(-100, -100, 800, 1000);
    flashAlpha -= 8;
  }

  ctx.restore();

  if (!isGameOver && !isAnimating() && isVsAI && turn === 2) {
    aiTimer++;
    if (aiTimer >= AI_DELAY) {
      makeAIMove();
      aiTimer = 0;
    }
  }
}

function drawStone(x, y, stoneType, scaleX) {
  if (stoneType === 0) return;
  ctx.save();
  ctx.fillStyle = (stoneType === 1) ? 'rgb(0, 0, 0)' : 'rgb(255, 255, 255)';
  ctx.beginPath();
  ctx.ellipse(x, y, (cellSize * 0.8 * scaleX) / 2, (cellSize * 0.8) / 2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawBottomPanel(black, white) {
  ctx.fillStyle = 'rgb(40, 40, 40)';
  ctx.fillRect(0, 600, 600, 200);

  ctx.strokeStyle = 'rgb(100, 100, 100)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, 600); ctx.lineTo(600, 600); ctx.stroke();

  ctx.fillStyle = 'rgb(255, 255, 255)';
  ctx.font = '15px sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText("B: " + black, 35, 630);
  ctx.fillText("W: " + white, 130, 630);

  ctx.textAlign = 'center';
  if (!isGameOver) {
    let tStr = (turn === 1) ? "BLACK TURN" + (isVsAI ? " (YOU)" : "") : "WHITE TURN" + (isVsAI ? " (AI)" : "");
    ctx.fillStyle = (turn === 1) ? 'rgb(200, 200, 200)' : 'rgb(255, 255, 255)';
    ctx.fillText(tStr, 370, 630);
  } else {
    ctx.fillStyle = 'rgb(255, 220, 0)';
    if (foulLoser !== 0) {
      ctx.fillText(foulLoser === 1 ? "ILLEGAL! WHITE WINS" : "ILLEGAL! BLACK WINS", 370, 630);
    } else {
      if (black > white) ctx.fillText("BLACK WINS!", 370, 630);
      else if (white > black) ctx.fillText("WHITE WINS!", 370, 630);
      else ctx.fillText("DRAW!", 370, 630);
    }
  }

  if (message !== "" && !isGameOver) {
    ctx.fillStyle = 'rgb(255, 200, 0)';
    ctx.font = '13px sans-serif';
    ctx.fillText(message, 370, 665);
  } else if (isGameOver) {
    ctx.fillStyle = 'rgb(180, 180, 180)';
    ctx.font = '13px sans-serif';
    ctx.fillText("GAME OVER", 370, 665);
  }

  ctx.strokeStyle = 'rgb(100, 100, 100)';
  ctx.beginPath();
  ctx.moveTo(20, 690); ctx.lineTo(580, 690); ctx.stroke();

  drawButton(30, 735, 165, 45, isVsAI ? "1P (VS AI)" : "2P (VS PLAYER)", false);
  drawButton(215, 735, 165, 45, isGameOver ? "PLAY AGAIN" : "RESET GAME", false);
  drawButton(400, 735, 165, 45, "HARD: " + (mode ? "ON" : "OFF"), mode);
}

canvas.addEventListener('click', (e) => {
  initAudio();
  const rect = canvas.getBoundingClientRect();
  const mouseX = (e.clientX - rect.left) * (600 / rect.width);
  const mouseY = (e.clientY - rect.top) * (800 / rect.height);

  if (screen === 0) {
    if (mouseX >= 180 && mouseX <= 420 && mouseY >= 380 && mouseY <= 420) {
      isVsAI = !isVsAI;
      return;
    }
    if (mouseX >= 180 && mouseX <= 420 && mouseY >= 435 && mouseY <= 475) {
      mode = !mode;
      return;
    }
    if (mouseX >= 160 && mouseX <= 440 && mouseY >= 495 && mouseY <= 555) {
      initGame();
      screen = 1;
      return;
    }
    return;
  }

  if (isAnimating()) return;

  if (mouseX >= 30 && mouseX <= 195 && mouseY >= 735 && mouseY <= 780) {
    isVsAI = !isVsAI;
    initGame();
    return;
  }
  if (mouseX >= 215 && mouseX <= 380 && mouseY >= 735 && mouseY <= 780) {
    initGame();
    return;
  }
  if (mouseX >= 400 && mouseX <= 565 && mouseY >= 735 && mouseY <= 780) {
    mode = !mode;
    initGame();
    return;
  }

  if (!isGameOver && mouseX >= 20 && mouseX <= 180 && mouseY >= 610 && mouseY <= 650) {
    let now = performance.now();
    if (now - lastScoreTapTime < 600) {
      scoreTapCount++;
      if (scoreTapCount >= 3) {
        scoreTapCount = 0;
        command1triggered();
      }
    } else {
      scoreTapCount = 1;
    }
    lastScoreTapTime = now;
    return;
  }

  if (isGameOver) return;
  if (isVsAI && turn === 2) return;

  let cx = Math.floor(mouseX / cellSize);
  let cy = Math.floor(mouseY / cellSize);

  if (cx < 0 || cx >= 8 || cy < 0 || cy >= 8) return;

  if (mode && !canPlaceAt(cx, cy, turn)) {
    isGameOver = true;
    foulLoser = turn;
    triggerExplosion(cx * cellSize + cellSize / 2, cy * cellSize + cellSize / 2);
    return;
  }

  if (board[cy][cx] !== 0) return;
  processMove(cx, cy);
});

function command1triggered() {
  if (isGameOver) return;
  for (let y = 0; y < 8; y++) {
    for (let x = 0; x < 8; x++) {
      board[y][x] = turn;
    }
  }
  isGameOver = true;
  shakeTimer = 50;
  flashAlpha = 255;
  playExplosionSound();
  playWinSound();

  explosionX = 300;
  explosionY = 300;
  particles = [];
  for (let i = 0; i < 350; i++) {
    particles.push(new Particle(explosionX, explosionY, true));
  }
  shockwaveSize = 10;
  isExploding = true;
}

function triggerExplosion(x, y) {
  explosionX = x;
  explosionY = y;
  particles = [];
  for (let i = 0; i < 200; i++) particles.push(new Particle(x, y, true));
  for (let i = 0; i < 60; i++) particles.push(new Particle(x, y, false));
  shockwaveSize = 10;
  shakeTimer = 35;
  flashAlpha = 230;
  isExploding = true;
  playExplosionSound();
}

function makeAIMove() {
  let bestScore = -99999;
  let bestX = -1, bestY = -1;
  for (let y = 0; y < 8; y++) {
    for (let x = 0; x < 8; x++) {
      if (canPlaceAt(x, y, turn)) {
        let score = EVAL_BOARD[y][x] + countFlips(x, y, turn) * 2;
        if (score > bestScore) {
          bestScore = score;
          bestX = x;
          bestY = y;
        }
      }
    }
  }
  if (bestX !== -1 && bestY !== -1) {
    processMove(bestX, bestY);
  }
}

function countFlips(x, y, player) {
  let opponent = (player === 1) ? 2 : 1;
  let dx = [ 0,  1,  1,  1,  0, -1, -1, -1];
  let dy = [-1, -1,  0,  1,  1,  1,  0, -1];
  let totalFlips = 0;
  for (let i = 0; i < 8; i++) {
    let nx = x + dx[i];
    let ny = y + dy[i];
    let count = 0;
    while (nx >= 0 && nx < 8 && ny >= 0 && ny < 8 && board[ny][nx] === opponent) {
      count++;
      nx += dx[i];
      ny += dy[i];
    }
    if (count > 0 && nx >= 0 && nx < 8 && ny >= 0 && ny < 8 && board[ny][nx] === player) {
      totalFlips += count;
    }
  }
  return totalFlips;
}

function processMove(cx, cy) {
  if (putStone(cx, cy, turn)) {
    message = "";
    let nextPlayer = (turn === 1) ? 2 : 1;
    if (canPlayerMove(nextPlayer)) {
      turn = nextPlayer;
    } else if (canPlayerMove(turn)) {
      message = (nextPlayer === 1 ? "BLACK" : "WHITE") + " PASSED!";
    } else {
      isGameOver = true;
    }
  }
}

function canPlaceAt(x, y, player) {
  if (board[y][x] !== 0) return false;
  let opponent = (player === 1) ? 2 : 1;
  let dx = [ 0,  1,  1,  1,  0, -1, -1, -1];
  let dy = [-1, -1,  0,  1,  1,  1,  0, -1];
  for (let i = 0; i < 8; i++) {
    let nx = x + dx[i];
    let ny = y + dy[i];
    let count = 0;
    while (nx >= 0 && nx < 8 && ny >= 0 && ny < 8 && board[ny][nx] === opponent) {
      count++;
      nx += dx[i];
      ny += dy[i];
    }
    if (count > 0 && nx >= 0 && nx < 8 && ny >= 0 && ny < 8 && board[ny][nx] === player) {
      return true;
    }
  }
  return false;
}

function canPlayerMove(player) {
  for (let y = 0; y < 8; y++) {
    for (let x = 0; x < 8; x++) {
      if (canPlaceAt(x, y, player)) return true;
    }
  }
  return false;
}

function putStone(x, y, player) {
  if (!canPlaceAt(x, y, player)) return false;
  let opponent = (player === 1) ? 2 : 1;
  let dx = [ 0,  1,  1,  1,  0, -1, -1, -1];
  let dy = [-1, -1,  0,  1,  1,  1,  0, -1];

  fromBoard[y][x] = player;
  toBoard[y][x] = player;
  animTimer[y][x] = ANIM_DURATION;
  animDelay[y][x] = 0;
  playTone(320, 0.08);

  for (let i = 0; i < 8; i++) {
    let nx = x + dx[i];
    let ny = y + dy[i];
    let count = 0;
    while (nx >= 0 && nx < 8 && ny >= 0 && ny < 8 && board[ny][nx] === opponent) {
      count++;
      nx += dx[i];
      ny += dy[i];
    }
    if (count > 0 && nx >= 0 && nx < 8 && ny >= 0 && ny < 8 && board[ny][nx] === player) {
      let fx = x + dx[i];
      let fy = y + dy[i];
      for (let j = 0; j < count; j++) {
        board[fy][fx] = player;
        fromBoard[fy][fx] = opponent;
        toBoard[fy][fx] = player;
        animTimer[fy][fx] = ANIM_DURATION;
        animDelay[fy][fx] = (j + 1) * 3;
        fx += dx[i];
        fy += dy[i];
      }
    }
  }
  board[y][x] = player;
  return true;
}

initGame();
requestAnimationFrame(loop);
